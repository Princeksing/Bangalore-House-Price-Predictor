<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bangalore House Price Predictor</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 0;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            background: linear-gradient(90deg, #0d6efd, #6f42c1);
            color: white;
            padding: 25px;
        }

        .card-header h1 {
            font-weight: 700;
        }

        .card-body {
            padding: 35px;
            background-color: white;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.15);
        }

        .predict-btn {
            padding: 13px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #0d6efd, #6f42c1);
            border: none;
        }

        .predict-btn:hover {
            opacity: 0.9;
        }

        .prediction-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f1fff7;
            border-radius: 15px;
            border: 1px solid #b7ebc9;
        }

        #prediction {
            font-size: 30px;
            font-weight: bold;
            color: #198754;
        }

        .price-note {
            color: #6c757d;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card main-card">

        <!-- Header -->
        <div class="card-header text-center">

            <h1>🏠 Bangalore House Price Predictor</h1>

            <p class="mb-0">
                Machine Learning Based House Price Prediction
            </p>

        </div>


        <div class="card-body">

            <h3 class="text-center mb-4">
                Enter House Details
            </h3>


            <form action="/predict" method="POST">

                <div class="row">

                    <!-- Location -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            📍 Select Location
                        </label>

                        <select
                            class="form-select"
                            name="location"
                            required>

                            {% for location in locations %}

                            <option
                                value="{{ location }}"
                                {% if selected_location == location %}selected{% endif %}>

                                {{ location }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- BHK -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            🏠 Number of BHK
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="bhk"
                            value="{{ bhk if bhk else '' }}"
                            placeholder="Example: 3"
                            min="1"
                            required>

                    </div>


                    <!-- Bathrooms -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            🚿 Number of Bathrooms
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="bath"
                            value="{{ bath if bath else '' }}"
                            placeholder="Example: 2"
                            min="1"
                            required>

                    </div>


                    <!-- Total Square Feet -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            📐 Total Square Feet
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="total_sqft"
                            value="{{ total_sqft if total_sqft else '' }}"
                            placeholder="Example: 1500"
                            min="100"
                            step="any"
                            required>

                    </div>

                </div>


                <!-- Predict Button -->
                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary predict-btn">

                        🔍 Predict House Price

                    </button>

                </div>

            </form>


            <!-- Prediction Result -->
            {% if prediction is defined and prediction is not none %}

            <div class="prediction-box text-center">

                <h4>
                    Estimated House Price
                </h4>

                <div id="prediction">
                    ₹ {{ prediction }} Lakhs
                </div>

                <div class="price-note">
                    Predicted price based on the entered property details
                </div>

            </div>

            {% endif %}

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
